name: flutter_application_1
description: "Habio"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.5.0

  # Media
  image_picker: ^1.1.2
  video_player: ^2.10.0

  # Maps
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  geocoding: ^4.0.0

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0
  firebase_app_check: ^0.4.7

  # Utilities
  intl: ^0.20.2
  cloud_functions: ^6.3.6
  url_launcher: ^6.3.1

  # Local device storage (added 2026-09-16 -- persists the Settings
  # screen's notification toggles and language choice across app
  # restarts; local-only, not synced to Firestore)
  shared_preferences: ^2.3.3

  # Payments (added 2026-09-09 -- real Razorpay Checkout, replacing
  # the mocked recordPayment/payCancellationFee flow)
  razorpay_flutter: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/images/
    - assets/images/onboarding/

# ================================================================
# APP LAUNCHER ICON (added 2026-09-06)
# ================================================================
#
# Generates the real Android launcher icon (all mipmap densities
# plus a proper Android 8+ adaptive icon) from the Habio logo,
# replacing the default Flutter icon. Run:
#   flutter pub get
#   dart run flutter_launcher_icons
# after editing anything below, then rebuild the app.
#
# image_path is the flattened legacy icon (white logo already
# composited onto the brand-blue background) used for older
# Android launchers. adaptive_icon_foreground/background build the
# proper Android 8+ adaptive icon separately, with the foreground
# padded so the mark isn't clipped by round/squircle launcher masks.

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/icon_customer_legacy_icon.png"
  adaptive_icon_background: "#1557FF"
  adaptive_icon_foreground: "assets/logo/icon_customer_adaptive_foreground.png"